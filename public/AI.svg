  <path d="M 352 175 Q 358 192, 352 210" fill="none" stroke="#1A6CAA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 345 228 Q 350 245, 340 260" fill="none" stroke="#1A6CAA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 320 268 Q 312 278, 298 274" fill="none" stroke="#1A6CAA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- Center fold -->
  <path d="M 260 118 C 256 150, 256 210, 260 285" fill="none" stroke="#1A6CAA" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Brain outline glow -->
  <path d="M 260 110 C 210 108,170 120,155 148 C 140 170,138 195,148 218 C 155 238,148 258,160 275 C 172 292,190 295,210 290 C 230 285,250 290,260 290 C 270 290,290 285,310 290 C 330 295,348 292,360 275 C 372 258,365 238,372 218 C 382 195,380 170,365 148 C 350 120,310 108,260 110 Z" fill="none" stroke="#55DDFF" stroke-width="2.5" opacity="0.7"/>

  <!-- NEURAL NETWORK NODES & LINES -->
  <!-- Center node -->
  <circle cx="260" cy="260" r="9" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="260" cy="260" r="5" fill="#55DDFF"/>
  <!-- Left nodes -->
  <circle cx="185" cy="185" r="9" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="185" cy="185" r="5" fill="#55DDFF"/>
  <circle cx="175" cy="235" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="175" cy="235" r="4.5" fill="#55DDFF"/>
  <circle cx="200" cy="155" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="200" cy="155" r="4.5" fill="#55DDFF"/>
