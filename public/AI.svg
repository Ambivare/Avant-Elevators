<svg width="520" height="520" viewBox="0 0 520 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cubeFaceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5BC8FF"/>
      <stop offset="100%" stop-color="#1A7EC4"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001A3A"/>
      <stop offset="100%" stop-color="#002D5A"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3AB8FF"/>
      <stop offset="100%" stop-color="#1A8BE0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cubeBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4DC0F5"/>
      <stop offset="40%" stop-color="#1A88DD"/>
      <stop offset="100%" stop-color="#0D5EB0"/>
    </linearGradient>
    <linearGradient id="cubeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A9AE0"/>
      <stop offset="100%" stop-color="#1670C0"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3AAAE8"/>
      <stop offset="100%" stop-color="#0D5EB0"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B8E8FF"/>
    </linearGradient>
    <radialGradient id="chamberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#004B8A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#001A3A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="edgeShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7AE0FF"/>
      <stop offset="50%" stop-color="#3AB8F5"/>
      <stop offset="100%" stop-color="#1A7EC4"/>
    </linearGradient>
  </defs>

  <!-- OUTER CUBE BODY -->
  <rect x="55" y="42" width="410" height="400" rx="52" fill="url(#cubeBody)"/>
  <rect x="55" y="42" width="410" height="180" rx="52" fill="#5CCDFF" opacity="0.25"/>
  <rect x="60" y="42" width="400" height="12" rx="8" fill="#8AE8FF" opacity="0.6"/>
  <rect x="55" y="50" width="12" height="386" rx="6" fill="#7AE0FF" opacity="0.45"/>
  <rect x="453" y="50" width="12" height="386" rx="6" fill="#1A6CB8" opacity="0.7"/>
  <rect x="60" y="422" width="400" height="18" rx="8" fill="#0A4A8A" opacity="0.6"/>

  <!-- BASE / PEDESTAL -->
  <rect x="80" y="430" width="360" height="48" rx="10" fill="url(#baseGrad)"/>
  <rect x="80" y="430" width="360" height="16" rx="8" fill="#5CCDFF" opacity="0.3"/>
  <rect x="80" y="462" width="360" height="16" rx="8" fill="#0A3A6A" opacity="0.5"/>
  <rect x="68" y="426" width="384" height="10" rx="5" fill="#2A90D8" opacity="0.8"/>

