  <circle cx="335" cy="185" r="5" fill="#55DDFF"/>
  <circle cx="345" cy="235" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="345" cy="235" r="4.5" fill="#55DDFF"/>
  <circle cx="320" cy="155" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="320" cy="155" r="4.5" fill="#55DDFF"/>
  <!-- Top node -->
  <circle cx="260" cy="135" r="8" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="260" cy="135" r="4.5" fill="#55DDFF"/>
  <!-- Connection lines -->
  <line x1="260" y1="260" x2="185" y2="185" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="260" y1="260" x2="175" y2="235" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="260" y1="260" x2="200" y2="155" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="260" y1="260" x2="335" y2="185" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="260" y1="260" x2="345" y2="235" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="260" y1="260" x2="320" y2="155" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="260" y1="260" x2="260" y2="135" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

