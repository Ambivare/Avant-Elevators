  <circle cx="432" cy="72" r="7" fill="#2A9AE0" stroke="#7AE0FF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="88" cy="418" r="7" fill="#1A70B8" stroke="#4AAAE0" stroke-width="1.5" opacity="0.8"/>
  <circle cx="432" cy="418" r="7" fill="#1A70B8" stroke="#4AAAE0" stroke-width="1.5" opacity="0.8"/>
  <line x1="85" y1="72" x2="91" y2="72" stroke="#5AC8EE" stroke-width="1.2" opacity="0.9"/>
  <line x1="88" y1="69" x2="88" y2="75" stroke="#5AC8EE" stroke-width="1.2" opacity="0.9"/>
  <line x1="429" y1="72" x2="435" y2="72" stroke="#5AC8EE" stroke-width="1.2" opacity="0.9"/>
  <line x1="432" y1="69" x2="432" y2="75" stroke="#5AC8EE" stroke-width="1.2" opacity="0.9"/>
  <line x1="85" y1="418" x2="91" y2="418" stroke="#3A8AC8" stroke-width="1.2" opacity="0.9"/>
  <line x1="88" y1="415" x2="88" y2="421" stroke="#3A8AC8" stroke-width="1.2" opacity="0.9"/>
  <line x1="429" y1="418" x2="435" y2="418" stroke="#3A8AC8" stroke-width="1.2" opacity="0.9"/>
  <line x1="432" y1="415" x2="432" y2="421" stroke="#3A8AC8" stroke-width="1.2" opacity="0.9"/>

  <!-- OUTER GLOW RING -->
  <rect x="55" y="42" width="410" height="400" rx="52" fill="none" stroke="#5AD0FF" stroke-width="3" opacity="0.4"/>
  <rect x="50" y="38" width="420" height="410" rx="56" fill="none" stroke="#3AB8EE" stroke-width="1.5" opacity="0.2"/>
</svg>
