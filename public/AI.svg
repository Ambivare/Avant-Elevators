  <rect x="95" y="76" width="330" height="50" rx="28" fill="#000E20" opacity="0.5"/>
  <rect x="95" y="76" width="330" height="328" rx="30" fill="none" stroke="#00AAFF" stroke-width="3" opacity="0.6"/>
  <rect x="100" y="81" width="320" height="318" rx="26" fill="none" stroke="#0EDFFF" stroke-width="1.5" opacity="0.35"/>

