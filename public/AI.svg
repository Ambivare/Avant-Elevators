  <path d="M 260 110 C 310 108, 350 120, 365 148 C 380 170, 382 195, 372 218 C 365 238, 372 258, 360 275 C 348 292, 330 295, 310 290 C 290 285, 270 290, 260 290 L 260 110 Z" fill="url(#brainGrad)" opacity="0.95"/>

