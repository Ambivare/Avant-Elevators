  <rect x="246" y="336" width="28" height="34" rx="4" fill="url(#arrowGrad)" opacity="0.95"/>
  <polygon points="260,300 226,340 294,340" fill="url(#arrowGrad)" opacity="0.95"/>
  <polygon points="260,306 232,340 288,340" fill="#FFFFFF" opacity="0.3"/>
  <rect x="249" y="336" width="22" height="30" rx="3" fill="#FFFFFF" opacity="0.3"/>

