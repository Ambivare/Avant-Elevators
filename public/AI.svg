  <path d="M 190 148 Q 182 162, 188 178" fill="none" stroke="#1A6CAA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 168 175 Q 162 192, 168 210" fill="none" stroke="#1A6CAA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 175 228 Q 170 245, 180 260" fill="none" stroke="#1A6CAA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 200 268 Q 208 278, 222 274" fill="none" stroke="#1A6CAA" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
