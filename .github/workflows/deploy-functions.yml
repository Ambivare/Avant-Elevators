name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: avant-elevators

      - name: Grant required IAM bindings for Cloud Functions v2
        run: |
          PROJECT_NUMBER=$(gcloud projects describe avant-elevators --format="value(projectNumber)")

          gcloud projects add-iam-policy-binding avant-elevators \
            --member="serviceAccount:service-${PROJECT_NUMBER}@gcp-sa-pubsub.iam.gserviceaccount.com" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --condition=None 2>/dev/null || true

          gcloud projects add-iam-policy-binding avant-elevators \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/run.invoker" \
            --condition=None 2>/dev/null || true

          gcloud projects add-iam-policy-binding avant-elevators \
            --member="serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role="roles/eventarc.eventReceiver" \
            --condition=None 2>/dev/null || true

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Deploy to Firebase
        run: firebase deploy --only functions --project avant-elevators --force
